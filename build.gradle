plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'bagel-tradingview' }

loom {
    splitEnvironmentSourceSets()
    mods {
        'bagel-tradingview' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'bagel-tradingview-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // The shipped mod uses Fabric Loader only. Fabric API runs the test harness.
    gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Mod Menu is optional: the mod compiles against its API for the settings button, and the tests run with it.
    clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    gametestImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    gametestRuntimeOnly "eu.pb4:placeholder-api:${project.placeholder_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
